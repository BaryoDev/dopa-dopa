<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dopa-Dopa - Escape the Farmers!</title>
    <style>
        :root {
            --primary: #FF6B35;
            --primary-hover: #FF8C5A;
            --bg-gradient: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-color: #ffffff;
            --accent: #ffeb3b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 600px;
            background: #000;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            border: 1px solid var(--glass-border);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(12px);
            background: rgba(0, 0, 0, 0.6);
            transition: opacity 0.3s ease;
            pointer-events: all;
        }

        #start-screen h1 {
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: 64px;
            margin-bottom: 12px;
            background: linear-gradient(to bottom right, #FFEDD5, #FF6B35);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
        }

        #start-screen p {
            font-size: 18px;
            margin-bottom: 40px;
            text-align: center;
            max-width: 480px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.8);
        }

        .btn-premium {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 20px;
            padding: 16px 40px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 100px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px -5px rgba(255, 107, 53, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-premium:hover {
            transform: translateY(-4px) scale(1.02);
            background: var(--primary-hover);
            box-shadow: 0 15px 30px -5px rgba(255, 107, 53, 0.6);
        }

        .btn-premium:active {
            transform: translateY(0) scale(0.98);
        }

        #score-container {
            position: absolute;
            top: 24px;
            left: 24px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        #score {
            font-size: 48px;
            font-weight: 900;
            font-family: 'Outfit', sans-serif;
            line-height: 1;
        }

        #high-score {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            display: none !important;
        }

        #instructions {
            margin-top: 32px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #instructions::before,
        #instructions::after {
            content: '';
            width: 20px;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
        }

        #game-over-screen h1 {
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: 56px;
            margin-bottom: 8px;
            color: #ff4d4d;
        }

        #final-score {
            font-size: 24px;
            margin-bottom: 32px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="game-container">
        <canvas id="game-canvas" width="800" height="600"></canvas>

        <div id="ui-overlay">
            <div id="score-container">
                <div id="high-score">Best: 0</div>
                <div id="score">0</div>
            </div>

            <div id="start-screen" class="screen">
                <h1>DOPA-DOPA</h1>
                <p>Help our chicken survive the farm road! Jump over rocks, crates, and tractors in this infinite dash.
                </p>
                <button id="start-btn" class="btn-premium">Start Escape</button>
                <div id="instructions">
                    Press SPACE to jump
                </div>
            </div>

            <div id="game-over-screen" class="screen hidden">
                <h1>CAUGHT!</h1>
                <p id="final-score">Score: 0</p>
                <button id="restart-btn" class="btn-premium">Retry Escape</button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
